name: Promote Full Releases

# One-shot helper: clear prerelease flags on published tags.
# Safe to re-run; future tags use release.yml with prerelease: false.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-full-releases.yml'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated tags to promote (latest first)'
        required: false
        default: 'v0.9.309,v0.9.308'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Clear prerelease flags
        uses: actions/github-script@v7
        with:
          script: |
            const raw = '${{ github.event.inputs.tags || 'v0.9.309,v0.9.308' }}';
            const tags = raw.split(',').map((t) => t.trim()).filter(Boolean);
            for (let i = 0; i < tags.length; i++) {
              const tag = tags[i];
              const { data: rel } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id,
                prerelease: false,
                make_latest: i === 0 ? 'true' : 'false',
              });
              console.log(`Promoted ${tag} (latest=${i === 0})`);
            }
