name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get version from tag
        id: tag_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vX.Y.Z, got: $TAG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Catalog audit
        run: npm run audit:catalog

      - name: Validate version consistency
        run: |
          node scripts/validate-release-version.mjs \
            --tag "${{ steps.tag_version.outputs.TAG }}" \
            --require-release-download

      - name: Package release ZIP
        run: npm run release:package

      - name: Extract changelog notes
        run: |
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.tag_version.outputs.TAG }}" > release_notes.md
          fi

      - name: Verify ZIP filename
        run: |
          ZIP="dist-release/mastery-system-${{ steps.tag_version.outputs.VERSION }}.zip"
          test -f "$ZIP"
          node scripts/validate-release-version.mjs \
            --tag "${{ steps.tag_version.outputs.TAG }}" \
            --require-release-download \
            --zip "$ZIP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_version.outputs.TAG }}"
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          ZIP="dist-release/mastery-system-${VERSION}.zip"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$ZIP" --clobber; then
                exit 0
              fi
            elif gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file release_notes.md \
              --latest; then
              exit 0
            fi
            echo "Release publish attempt ${attempt} failed; retrying..."
            sleep $((attempt * 8))
          done
          echo "Could not publish GitHub release after retries."
          exit 1
