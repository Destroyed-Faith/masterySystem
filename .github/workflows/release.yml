name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    # Pin 24.04 — ubuntu-latest is migrating and has been flaky for npm.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Get version from tag
        id: tag_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vX.Y.Z, got: $TAG"
            exit 1
          fi

      # Best-effort: registry outages must not block Forge ZIP publish.
      # Tagged commits already include a built dist/ for emergency packaging.
      - name: Install dependencies
        id: npm_ci
        continue-on-error: true
        run: |
          set -euo pipefail
          npm -v
          node -v
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}..."
            if npm ci --no-audit --no-fund; then
              echo "mode=ci" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "npm ci attempt ${attempt} failed"
            sleep $((attempt * 5))
          done
          echo "npm ci failed — trying npm install"
          if npm install --no-audit --no-fund; then
            echo "mode=install" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=skip" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Production build
        id: build
        if: steps.npm_ci.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Unit tests
        if: steps.npm_ci.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Catalog audit
        if: steps.npm_ci.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run audit:catalog

      - name: Require packaged dist
        run: |
          set -euo pipefail
          if [[ ! -f dist/module.js ]]; then
            echo "Missing dist/module.js — cannot package without npm build or committed dist."
            exit 1
          fi
          if [[ "${{ steps.npm_ci.outcome }}" != "success" ]]; then
            echo "::warning::npm install failed — packaging committed dist/ from the tag (Forge republish fallback)."
          elif [[ "${{ steps.build.outcome }}" != "success" ]]; then
            echo "::warning::npm build failed — packaging committed dist/ from the tag."
          fi

      - name: Validate version consistency
        run: |
          node scripts/validate-release-version.mjs \
            --tag "${{ steps.tag_version.outputs.TAG }}" \
            --require-release-download

      - name: Package release ZIP
        run: node scripts/package-release.mjs

      - name: Package particle module ZIP
        run: |
          node modules/df-particle-effects/scripts/package.mjs
          test -f release/df-particle-effects.zip

      - name: Extract changelog notes
        run: |
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.tag_version.outputs.TAG }}" > release_notes.md
          fi

      - name: Verify ZIP filename
        run: |
          ZIP="dist-release/mastery-system-${{ steps.tag_version.outputs.VERSION }}.zip"
          test -f "$ZIP"
          node scripts/validate-release-version.mjs \
            --tag "${{ steps.tag_version.outputs.TAG }}" \
            --require-release-download \
            --zip "$ZIP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_version.outputs.TAG }}"
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          ZIP="dist-release/mastery-system-${VERSION}.zip"
          MODULE_ZIP="release/df-particle-effects.zip"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$ZIP" "$MODULE_ZIP" --clobber; then
                exit 0
              fi
            elif gh release create "$TAG" "$ZIP" "$MODULE_ZIP" \
              --title "$TAG" \
              --notes-file release_notes.md \
              --latest; then
              exit 0
            fi
            echo "Release publish attempt ${attempt} failed; retrying..."
            sleep $((attempt * 8))
          done
          echo "Could not publish GitHub release after retries."
          exit 1
