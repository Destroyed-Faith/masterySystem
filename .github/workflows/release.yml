name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get version from tag
        id: tag_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vX.Y.Z, got: $TAG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Catalog audit
        run: npm run audit:catalog

      - name: Validate version consistency
        run: |
          node scripts/validate-release-version.mjs \
            --tag "${{ steps.tag_version.outputs.TAG }}" \
            --require-release-download

      - name: Package release ZIP
        run: npm run release:package

      - name: Extract changelog notes
        run: |
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.tag_version.outputs.TAG }}" > release_notes.md
          fi

      - name: Verify ZIP filename
        run: |
          ZIP="dist-release/mastery-system-${{ steps.tag_version.outputs.VERSION }}.zip"
          test -f "$ZIP"
          node scripts/validate-release-version.mjs \
            --tag "${{ steps.tag_version.outputs.TAG }}" \
            --require-release-download \
            --zip "$ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist-release/mastery-system-${{ steps.tag_version.outputs.VERSION }}.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
